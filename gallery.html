.bt-cs:hover{background:var(--violet-600)}
@media(max-width:1100px){#header .gnb{display:none}}
.g-head{padding:calc(var(--hd) + clamp(40px,6vw,72px)) 0 clamp(28px,4vw,48px);background:linear-gradient(135deg,#F4EFFF,#fff);text-align:center}

.g-head p{margin-top:12px;color:var(--gray1);font-size:15px}
.g-grid{display:grid;gap:14px;grid-template-columns:1fr 1fr;padding-bottom:clamp(48px,7vw,90px)}
@media(min-width:901px){.g-grid{grid-template-columns:repeat(3,1fr);gap:18px}}
.g-item{position:relative;overflow:hidden;border-radius:6px;cursor:zoom-in;background:var(--soft)}
.g-item img{width:100%;height:100%;aspect-ratio:16/9;object-fit:cover;transition:transform .6s ease}
.g-item:hover img{transform:scale(1.04)}
.g-item figcaption{position:absolute;left:0;right:0;bottom:0;padding:26px 16px 10px;font-size:12px;color:rgba(255,255,255,.9);background:linear-gradient(transparent,rgba(16,20,24,.72))}
.reveal{opacity:0;transform:translateY(30px);transition:opacity .7s cubic-bezier(.22,.61,.36,1),transform .7s cubic-bezier(.22,.61,.36,1)}
.reveal.is-in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}
#lb{position:fixed;inset:0;z-index:300;background:rgba(8,10,13,.92);display:none;align-items:center;justify-content:center;padding:16px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:88vh;border-radius:4px}

footer{background:#0b0e12;color:rgba(255,255,255,.55);font-size:12px;padding:40px 0 46px;line-height:1.9}
footer .f-top{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)},$$=function(s){return [].slice.call(document.querySelectorAll(s))};
/* 스크롤 등장 */
var els=$$('.reveal');
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('is-in');io.unobserve(e.target)}})},{threshold:.08});
els.forEach(function(el){io.observe(el)});
/* 라이트박스 */
var lb=$('#lb'),lbImg=lb.querySelector('img');
document.addEventListener('click',function(e){
  var it=e.target.closest('.g-item');
  if(it&&it.querySelector('img')){lbImg.src=it.querySelector('img').src;lb.classList.add('on')}
});
lb.addEventListener('click',function(){lb.classList.remove('on');lbImg.removeAttribute('src')});
addEventListener('keydown',function(e){if(e.key==='Escape'&&lb.classList.contains('on'))lb.click()});
})();
</script>
